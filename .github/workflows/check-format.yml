name: Check

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  format:
    name: Format changed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prettier on the files this PR changes
        run: bash scripts/check-format-changed.sh "origin/${{ github.base_ref }}"
